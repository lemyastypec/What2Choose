<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What2Choose</title>
  <script>
    (function () {
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      --bg: #fef6e4; --text: #222; --muted: #999; --card: #fff; --card-text: #333;
      --accent: #f582ae; --accent-hover: #e0679a; --soft: #fde2ec; --border: #f582ae;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #16161a; --text: #fffffe; --muted: #94a1b2; --card: #242629; --card-text: #fffffe;
      --accent: #f582ae; --accent-hover: #e0679a; --soft: #3a2a33; --border: #f582ae;
      color-scheme: dark;
    }

    body { font-family: sans-serif; text-align: center; margin-top: 70px;
           background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
    h1 { font-size: 2em; }
    textarea, input[type="text"] { width: 300px; max-width: 90%; font-size: 1em; padding: 8px;
               background: var(--card); color: var(--card-text);
               border: 2px solid var(--border); border-radius: 8px; box-sizing: border-box; }
    textarea { height: 140px; }
    button { font-size: 1.2em; padding: 12px 28px; margin: 12px; border: none;
             border-radius: 10px; background: var(--accent); color: white; cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    #result { font-size: 2em; margin-top: 24px; min-height: 60px; transition: color 0.2s; }
    #result.spinning { color: var(--muted); }
    #result.done { color: var(--text); animation: pop 0.5s ease; }
    @keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

    #confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                pointer-events: none; z-index: 50; }

    #top-controls { position: fixed; top: 16px; right: 16px; display: flex; gap: 6px; z-index: 60; }
    #top-controls button { font-size: 0.95em; padding: 6px 12px; margin: 0;
                           background: var(--card); color: var(--card-text); border: 2px solid var(--border); }
    #top-controls button.active { background: var(--accent); color: white; }

    #presets { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
               max-width: 520px; margin: 0 auto 16px; padding: 0 12px; }
    #presets button { font-size: 0.95em; padding: 8px 14px; margin: 0;
                      background: var(--card); color: var(--card-text); border: 2px solid var(--border); }
    #presets button:hover { background: var(--soft); }
    #presets button.active { background: var(--accent); color: white; }
    #presets button.add { border-style: dashed; }

    /* Кнопка «Редактировать» */
    #preset-actions { min-height: 8px; }
    .small-btn { font-size: 0.9em; padding: 6px 14px; margin: 0 0 8px; background: var(--card);
                 color: var(--card-text); border: 2px solid var(--border); }
    .small-btn:hover { background: var(--soft); }

    /* Редактор набора */
    #editor { max-width: 360px; margin: 0 auto 20px; padding: 16px; background: var(--soft);
              border-radius: 14px; }
    #editor[hidden] { display: none; }
    #editor h3 { margin: 0 0 10px; }
    #editor input, #editor textarea { display: block; margin: 8px auto; }
    #editor button { font-size: 1em; padding: 8px 16px; margin: 6px 4px 0; }
    #editor button.ghost { background: var(--card); color: var(--card-text); border: 2px solid var(--border); }
    #editor button.danger { background: #d64545; }
    #ed-error { color: #d64545; min-height: 1.2em; font-size: 0.9em; }

    #credit { position: fixed; bottom: 12px; right: 16px; font-size: 0.85em; color: var(--muted); z-index: 60; }
    #credit a { color: inherit; text-decoration: none; font-weight: bold; }
    #credit a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <div id="top-controls">
    <button id="btn-ru" onclick="setLang('ru')">RU</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
    <button id="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme"></button>
  </div>

  <h1 id="title"></h1>
  <div id="presets"></div>
  <div id="preset-actions"></div>

  <div id="editor" hidden>
    <h3 id="ed-title"></h3>
    <input type="text" id="ed-name" maxlength="30">
    <textarea id="ed-items"></textarea>
    <div id="ed-error"></div>
    <button id="ed-save" onclick="saveEditor()"></button>
    <button id="ed-cancel" class="ghost" onclick="closeEditor()"></button>
    <button id="ed-delete" class="danger" onclick="deleteCustom()"></button>
  </div>

  <p id="hint"></p>
  <textarea id="options"></textarea>
  <br>
  <button id="pick-btn" onclick="pick()"></button>
  <div id="result"></div>

  <div id="credit">created by <a href="https://github.com/lemyastypec" target="_blank" rel="noopener">lemyastypec</a></div>

  <script>
    const texts = {
      ru: {
        title: "🎲 Что выбрать?",
        hint: "Выберите набор или впишите свои варианты, по одному на строку:",
        button: "Выбрать!",
        empty: "Добавьте хоть один вариант 🙂",
        newPreset: "➕ Новый набор",
        edit: "✏️ Редактировать набор",
        edTitleNew: "Новый набор",
        edTitleEdit: "Редактирование набора",
        edName: "Название набора",
        edItems: "Варианты, по одному на строку",
        save: "Сохранить",
        cancel: "Отмена",
        del: "Удалить",
        needName: "Введите название",
        needItems: "Добавьте хотя бы один вариант",
        confirmDel: "Удалить этот набор?"
      },
      en: {
        title: "🎲 What to choose?",
        hint: "Pick a preset or enter your own options, one per line:",
        button: "Pick!",
        empty: "Add at least one option 🙂",
        newPreset: "➕ New preset",
        edit: "✏️ Edit preset",
        edTitleNew: "New preset",
        edTitleEdit: "Edit preset",
        edName: "Preset name",
        edItems: "Options, one per line",
        save: "Save",
        cancel: "Cancel",
        del: "Delete",
        needName: "Enter a name",
        needItems: "Add at least one option",
        confirmDel: "Delete this preset?"
      }
    };

    // Встроенные пресеты
    const presets = {
      food: {
        label: { ru: "🍕 Что заказать", en: "🍕 What to order" },
        items: {
          ru: ["Пицца", "Суши", "Бургер", "Салат", "Суп"],
          en: ["Pizza", "Sushi", "Burger", "Salad", "Soup"]
        }
      },
      movie: {
        label: { ru: "🎬 Жанр фильмов", en: "🎬 Movie genre" },
        items: {
          ru: ["Комедия", "Боевик", "Ужасы", "Фантастика", "Драма", "Триллер", "Мелодрама", "Мультфильм"],
          en: ["Comedy", "Action", "Horror", "Sci-Fi", "Drama", "Thriller", "Romance", "Animation"]
        }
      },
      travel: {
        label: { ru: "✈️ Куда съездить", en: "✈️ Where to travel" },
        items: {
          ru: ["Стамбул", "Тбилиси", "Рим", "Токио", "Бали", "Дубай", "Париж"],
          en: ["Istanbul", "Tbilisi", "Rome", "Tokyo", "Bali", "Dubai", "Paris"]
        }
      },
      activity: {
        label: { ru: "🎳 Чем заняться", en: "🎳 What to do" },
        items: {
          ru: ["Прогулка", "Кино", "Настольные игры", "Боулинг", "Готовить дома", "Спортзал"],
          en: ["Go for a walk", "Cinema", "Board games", "Bowling", "Cook at home", "Gym"]
        }
      },
      custom: {
        label: { ru: "✏️ Свой список", en: "✏️ My own list" },
        items: { ru: [], en: [] }
      }
    };

    let currentLang = "ru";
    let currentPreset = "food";   // ключ встроенного набора или "c:ID" для своего
    let spinning = false;
    let editingId = null;         // null = создаём новый набор

    /* ---------- Свои наборы (localStorage) ---------- */
    let customPresets = [];

    function loadCustom() {
      try {
        const data = JSON.parse(localStorage.getItem("customPresets") || "[]");
        if (Array.isArray(data)) customPresets = data;
      } catch (e) { customPresets = []; }
    }

    function saveCustom() {
      try { localStorage.setItem("customPresets", JSON.stringify(customPresets)); } catch (e) {}
    }

    function findCustom(key) {
      if (!key.startsWith("c:")) return null;
      return customPresets.find(p => p.id === key.slice(2)) || null;
    }

    function parseItems(text) {
      return text.split("\n").map(s => s.trim()).filter(s => s !== "");
    }

    /* ---------- Конфетти ---------- */
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let confettiRunning = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function launchConfetti() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const colors = ["#f582ae", "#ffd803", "#8bd3dd", "#7f5af0", "#2cb67d", "#ff8e3c"];
      const rect = document.getElementById("result").getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      for (let i = 0; i < 140; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 12;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 6,
          size: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.4,
          life: 0,
          maxLife: 90 + Math.random() * 60
        });
      }
      if (!confettiRunning) {
        confettiRunning = true;
        requestAnimationFrame(drawConfetti);
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life < p.maxLife && p.y < canvas.height + 20);
      for (const p of particles) {
        p.life++;
        p.vy += 0.3;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.spin;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }
      if (particles.length > 0) {
        requestAnimationFrame(drawConfetti);
      } else {
        confettiRunning = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    /* ---------- Тема ---------- */
    function updateThemeButton() {
      const theme = document.documentElement.getAttribute("data-theme");
      document.getElementById("btn-theme").textContent = theme === "dark" ? "☀️" : "🌙";
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      updateThemeButton();
    }

    /* ---------- Пресеты ---------- */
    function presetText(key, lang) {
      const c = findCustom(key);
      if (c) return c.items.join("\n");
      return presets[key].items[lang].join("\n");
    }

    function renderPresets() {
      const box = document.getElementById("presets");
      box.innerHTML = "";

      for (const key in presets) {
        const b = document.createElement("button");
        b.textContent = presets[key].label[currentLang];
        b.classList.toggle("active", key === currentPreset);
        b.onclick = () => selectPreset(key);
        box.appendChild(b);
      }

      for (const p of customPresets) {
        const key = "c:" + p.id;
        const b = document.createElement("button");
        b.textContent = "⭐ " + p.name;
        b.classList.toggle("active", key === currentPreset);
        b.onclick = () => selectPreset(key);
        box.appendChild(b);
      }

      const add = document.createElement("button");
      add.className = "add";
      add.textContent = texts[currentLang].newPreset;
      add.onclick = () => openEditor(null);
      box.appendChild(add);

      // Кнопка «Редактировать» только для своих наборов
      const actions = document.getElementById("preset-actions");
      actions.innerHTML = "";
      const c = findCustom(currentPreset);
      if (c) {
        const e = document.createElement("button");
        e.className = "small-btn";
        e.textContent = texts[currentLang].edit;
        e.onclick = () => openEditor(c.id);
        actions.appendChild(e);
      }
    }

    function selectPreset(key) {
      if (spinning) return;
      currentPreset = key;
      document.getElementById("options").value = presetText(key, currentLang);
      clearResult();
      renderPresets();
    }

    function clearResult() {
      const result = document.getElementById("result");
      result.textContent = "";
      result.className = "";
    }

    /* ---------- Редактор набора ---------- */
    function applyEditorTexts() {
      const t = texts[currentLang];
      document.getElementById("ed-title").textContent = editingId ? t.edTitleEdit : t.edTitleNew;
      document.getElementById("ed-name").placeholder = t.edName;
      document.getElementById("ed-items").placeholder = t.edItems;
      document.getElementById("ed-save").textContent = t.save;
      document.getElementById("ed-cancel").textContent = t.cancel;
      document.getElementById("ed-delete").textContent = t.del;
    }

    function openEditor(id) {
      if (spinning) return;
      editingId = id;
      const nameBox = document.getElementById("ed-name");
      const itemsBox = document.getElementById("ed-items");

      if (id) {
        const c = customPresets.find(p => p.id === id);
        nameBox.value = c.name;
        itemsBox.value = c.items.join("\n");
      } else {
        nameBox.value = "";
        // Если человек уже вписал свой список, подставляем его в новый набор
        itemsBox.value = currentPreset === "custom" ? document.getElementById("options").value.trim() : "";
      }

      document.getElementById("ed-delete").style.display = id ? "" : "none";
      document.getElementById("ed-error").textContent = "";
      applyEditorTexts();
      document.getElementById("editor").hidden = false;
      nameBox.focus();
    }

    function closeEditor() {
      document.getElementById("editor").hidden = true;
      editingId = null;
    }

    function saveEditor() {
      const t = texts[currentLang];
      const name = document.getElementById("ed-name").value.trim();
      const items = parseItems(document.getElementById("ed-items").value);
      const err = document.getElementById("ed-error");

      if (!name) { err.textContent = t.needName; return; }
      if (items.length === 0) { err.textContent = t.needItems; return; }

      let id = editingId;
      if (id) {
        const c = customPresets.find(p => p.id === id);
        c.name = name;
        c.items = items;
      } else {
        id = Date.now().toString(36);
        customPresets.push({ id: id, name: name, items: items });
      }
      saveCustom();
      closeEditor();
      selectPreset("c:" + id);
    }

    function deleteCustom() {
      if (!editingId) return;
      if (!confirm(texts[currentLang].confirmDel)) return;
      customPresets = customPresets.filter(p => p.id !== editingId);
      saveCustom();
      closeEditor();
      selectPreset("food");
    }

    /* ---------- Язык ---------- */
    function setLang(lang) {
      if (spinning) return;
      const box = document.getElementById("options");
      const untouched = box.value.trim() === presetText(currentPreset, currentLang).trim();

      currentLang = lang;
      if (untouched) {
        box.value = presetText(currentPreset, lang);
      }

      document.documentElement.lang = lang;
      document.getElementById("title").textContent = texts[lang].title;
      document.getElementById("hint").textContent = texts[lang].hint;
      document.getElementById("pick-btn").textContent = texts[lang].button;
      clearResult();
      applyEditorTexts();

      document.getElementById("btn-ru").classList.toggle("active", lang === "ru");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
      renderPresets();
    }

    /* ---------- Выбор с анимацией ---------- */
    function randomItem(list, exclude) {
      let item;
      do {
        item = list[Math.floor(Math.random() * list.length)];
      } while (list.length > 1 && item === exclude);
      return item;
    }

    function pick() {
      if (spinning) return;

      const list = parseItems(document.getElementById("options").value);
      const result = document.getElementById("result");
      const btn = document.getElementById("pick-btn");

      if (list.length === 0) {
        result.className = "";
        result.textContent = texts[currentLang].empty;
        return;
      }

      const finalChoice = list[Math.floor(Math.random() * list.length)];

      if (list.length === 1) {
        result.className = "done";
        result.textContent = "🎉 " + finalChoice;
        launchConfetti();
        return;
      }

      spinning = true;
      btn.disabled = true;
      result.className = "spinning";

      const totalSteps = 16;
      let step = 0;
      let delay = 60;
      let last = "";

      function tick() {
        step++;
        if (step >= totalSteps) {
          result.className = "";
          void result.offsetWidth;
          result.className = "done";
          result.textContent = "🎉 " + finalChoice;
          spinning = false;
          btn.disabled = false;
          launchConfetti();
          return;
        }
        const exclude = (step === totalSteps - 1) ? finalChoice : last;
        last = randomItem(list, exclude);
        result.textContent = last;
        delay *= 1.12;
        setTimeout(tick, delay);
      }
      tick();
    }

    // Старт
    loadCustom();
    document.getElementById("options").value = presetText(currentPreset, "ru");
    updateThemeButton();
    setLang("ru");
  </script>
</body>
</html>
