<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What2Choose</title>
  <script>
    // Ставим тему до отрисовки страницы, чтобы не мигало белым
    (function () {
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      --bg: #fef6e4;
      --text: #222;
      --muted: #999;
      --card: #fff;
      --card-text: #333;
      --accent: #f582ae;
      --accent-hover: #e0679a;
      --soft: #fde2ec;
      --border: #f582ae;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #16161a;
      --text: #fffffe;
      --muted: #94a1b2;
      --card: #242629;
      --card-text: #fffffe;
      --accent: #f582ae;
      --accent-hover: #e0679a;
      --soft: #3a2a33;
      --border: #f582ae;
      color-scheme: dark;
    }

    body { font-family: sans-serif; text-align: center; margin-top: 70px;
           background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
    h1 { font-size: 2em; }
    textarea { width: 300px; max-width: 90%; height: 140px; font-size: 1em; padding: 8px;
               background: var(--card); color: var(--card-text);
               border: 2px solid var(--border); border-radius: 8px; }
    button { font-size: 1.2em; padding: 12px 28px; margin: 12px; border: none;
             border-radius: 10px; background: var(--accent); color: white; cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Результат и анимация */
    #result { font-size: 2em; margin-top: 24px; min-height: 60px; transition: color 0.2s; }
    #result.spinning { color: var(--muted); }
    #result.done { color: var(--text); animation: pop 0.5s ease; }
    @keyframes pop {
      0%   { transform: scale(0.6); }
      60%  { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    /* Конфетти: слой поверх страницы, клики пропускает */
    #confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                pointer-events: none; z-index: 50; }

    /* Верхний правый угол: язык и тема */
    #top-controls { position: fixed; top: 16px; right: 16px; display: flex; gap: 6px; z-index: 60; }
    #top-controls button { font-size: 0.95em; padding: 6px 12px; margin: 0;
                           background: var(--card); color: var(--card-text);
                           border: 2px solid var(--border); }
    #top-controls button.active { background: var(--accent); color: white; }
    #top-controls button:disabled { opacity: 0.6; }

    /* Пресеты */
    #presets { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
               max-width: 520px; margin: 0 auto 16px; padding: 0 12px; }
    #presets button { font-size: 0.95em; padding: 8px 14px; margin: 0;
                      background: var(--card); color: var(--card-text);
                      border: 2px solid var(--border); }
    #presets button:hover { background: var(--soft); }
    #presets button.active { background: var(--accent); color: white; }

    /* Подпись в правом нижнем углу */
    #credit { position: fixed; bottom: 12px; right: 16px; font-size: 0.85em;
              color: var(--muted); z-index: 60; }
    #credit a { color: inherit; text-decoration: none; font-weight: bold; }
    #credit a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <div id="top-controls">
    <button id="btn-ru" onclick="setLang('ru')">RU</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
    <button id="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme"></button>
  </div>

  <h1 id="title"></h1>
  <div id="presets"></div>
  <p id="hint"></p>
  <textarea id="options"></textarea>
  <br>
  <button id="pick-btn" onclick="pick()"></button>
  <div id="result"></div>

  <div id="credit">created by <a href="https://github.com/lemyastypec" target="_blank" rel="noopener">lemyastypec</a></div>

  <script>
    const texts = {
      ru: {
        title: "🎲 Что выбрать?",
        hint: "Выберите набор или впишите свои варианты, по одному на строку:",
        button: "Выбрать!",
        empty: "Добавьте хоть один вариант 🙂"
      },
      en: {
        title: "🎲 What to choose?",
        hint: "Pick a preset or enter your own options, one per line:",
        button: "Pick!",
        empty: "Add at least one option 🙂"
      }
    };

    // Пресеты. Чтобы добавить свой, скопируйте любой блок и поменяйте названия и варианты.
    const presets = {
      food: {
        label: { ru: "🍕 Что заказать", en: "🍕 What to order" },
        items: {
          ru: ["Пицца", "Суши", "Бургер", "Салат", "Суп"],
          en: ["Pizza", "Sushi", "Burger", "Salad", "Soup"]
        }
      },
      movie: {
        label: { ru: "🎬 Жанр фильмов", en: "🎬 Movie genre" },
        items: {
          ru: ["Комедия", "Боевик", "Ужасы", "Фантастика", "Драма", "Триллер", "Мелодрама", "Мультфильм"],
          en: ["Comedy", "Action", "Horror", "Sci-Fi", "Drama", "Thriller", "Romance", "Animation"]
        }
      },
      travel: {
        label: { ru: "✈️ Куда съездить", en: "✈️ Where to travel" },
        items: {
          ru: ["Стамбул", "Тбилиси", "Рим", "Токио", "Бали", "Дубай", "Париж"],
          en: ["Istanbul", "Tbilisi", "Rome", "Tokyo", "Bali", "Dubai", "Paris"]
        }
      },
      activity: {
        label: { ru: "🎳 Чем заняться", en: "🎳 What to do" },
        items: {
          ru: ["Прогулка", "Кино", "Настольные игры", "Боулинг", "Готовить дома", "Спортзал"],
          en: ["Go for a walk", "Cinema", "Board games", "Bowling", "Cook at home", "Gym"]
        }
      },
      custom: {
        label: { ru: "✏️ Свой список", en: "✏️ My own list" },
        items: { ru: [], en: [] }
      }
    };

    let currentLang = "ru";
    let currentPreset = "food";
    let spinning = false;

    /* ---------- Конфетти ---------- */
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let confettiRunning = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function launchConfetti() {
      // Не запускаем, если у человека включено «уменьшение движения»
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const colors = ["#f582ae", "#ffd803", "#8bd3dd", "#7f5af0", "#2cb67d", "#ff8e3c"];
      // Стреляем из места, где появился результат
      const rect = document.getElementById("result").getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      for (let i = 0; i < 140; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 12;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 6,   // чуть подбрасываем вверх
          size: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.4,
          life: 0,
          maxLife: 90 + Math.random() * 60
        });
      }
      if (!confettiRunning) {
        confettiRunning = true;
        requestAnimationFrame(drawConfetti);
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles = particles.filter(p => p.life < p.maxLife && p.y < canvas.height + 20);

      for (const p of particles) {
        p.life++;
        p.vy += 0.3;        // гравитация
        p.vx *= 0.985;      // сопротивление воздуха
        p.vy *= 0.985;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.spin;

        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }

      if (particles.length > 0) {
        requestAnimationFrame(drawConfetti);
      } else {
        confettiRunning = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    /* ---------- Тема ---------- */
    function updateThemeButton() {
      const theme = document.documentElement.getAttribute("data-theme");
      document.getElementById("btn-theme").textContent = theme === "dark" ? "☀️" : "🌙";
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      updateThemeButton();
    }

    /* ---------- Пресеты и язык ---------- */
    function presetText(key, lang) {
      return presets[key].items[lang].join("\n");
    }

    function renderPresets() {
      const box = document.getElementById("presets");
      box.innerHTML = "";
      for (const key in presets) {
        const b = document.createElement("button");
        b.textContent = presets[key].label[currentLang];
        b.classList.toggle("active", key === currentPreset);
        b.onclick = () => selectPreset(key);
        box.appendChild(b);
      }
    }

    function selectPreset(key) {
      if (spinning) return;
      currentPreset = key;
      document.getElementById("options").value = presetText(key, currentLang);
      clearResult();
      renderPresets();
    }

    function clearResult() {
      const result = document.getElementById("result");
      result.textContent = "";
      result.className = "";
    }

    function setLang(lang) {
      if (spinning) return;
      const box = document.getElementById("options");
      const untouched = box.value.trim() === presetText(currentPreset, currentLang).trim();

      currentLang = lang;
      if (untouched) {
        box.value = presetText(currentPreset, lang);
      }

      document.documentElement.lang = lang;
      document.getElementById("title").textContent = texts[lang].title;
      document.getElementById("hint").textContent = texts[lang].hint;
      document.getElementById("pick-btn").textContent = texts[lang].button;
      clearResult();

      document.getElementById("btn-ru").classList.toggle("active", lang === "ru");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
      renderPresets();
    }

    /* ---------- Выбор с анимацией ---------- */
    function randomItem(list, exclude) {
      let item;
      do {
        item = list[Math.floor(Math.random() * list.length)];
      } while (list.length > 1 && item === exclude);
      return item;
    }

    function pick() {
      if (spinning) return;

      const list = document.getElementById("options").value
        .split("\n")
        .map(s => s.trim())
        .filter(s => s !== "");
      const result = document.getElementById("result");
      const btn = document.getElementById("pick-btn");

      if (list.length === 0) {
        result.className = "";
        result.textContent = texts[currentLang].empty;
        return;
      }

      const finalChoice = list[Math.floor(Math.random() * list.length)];

      if (list.length === 1) {
        result.className = "done";
        result.textContent = "🎉 " + finalChoice;
        launchConfetti();
        return;
      }

      spinning = true;
      btn.disabled = true;
      result.className = "spinning";

      const totalSteps = 16;
      let step = 0;
      let delay = 60;
      let last = "";

      function tick() {
        step++;
        if (step >= totalSteps) {
          result.className = "";
          void result.offsetWidth;
          result.className = "done";
          result.textContent = "🎉 " + finalChoice;
          spinning = false;
          btn.disabled = false;
          launchConfetti();   // 🎊
          return;
        }
        const exclude = (step === totalSteps - 1) ? finalChoice : last;
        last = randomItem(list, exclude);
        result.textContent = last;
        delay *= 1.12;
        setTimeout(tick, delay);
      }
      tick();
    }

    // Старт
    document.getElementById("options").value = presetText(currentPreset, "ru");
    updateThemeButton();
    setLang("ru");
  </script>
</body>
</html>
